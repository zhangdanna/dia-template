name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: 'npm'  # 自动缓存 node_modules，加速构建

      - run: npm ci     # 用 ci 而不是 install，确保依赖锁定

      - run: npm run lint        # 代码规范检查
      - run: npm run type-check  # TypeScript 类型检查（如果有的话）
      - run: npm run build       # 构建验证
      - run: npm run test        # 单元测试（如果有的话）